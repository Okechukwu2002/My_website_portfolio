{% extends "base.html" %}

{% block title %}Admin Login • Ebube Okechukwu{% endblock %}

{% block content %}
<section class="flex items-center justify-center py-20">
  <div class="w-full max-w-md px-4 sm:px-0">
    <div
      class="rounded-2xl border border-white/10 bg-slate-900/80 p-6 shadow-[0_20px_60px_rgba(15,23,42,0.9)]"
    >
      <h1 class="text-lg font-semibold text-slate-100">
        Admin Dashboard Login
      </h1>
      <p class="mt-1 text-xs text-slate-400">
        This dashboard is for personal use to review contact requests securely.
      </p>

      <form
        action="{{ url_for('admin_login') }}"
        method="post"
        class="mt-5 space-y-4"
      >
        <div>
          <label
            for="password"
            class="block text-xs font-medium text-slate-200"
            >Admin Password</label
          >
          <input
            type="password"
            id="password"
            name="password"
            required
            class="mt-1 block w-full rounded-xl border border-slate-600 bg-slate-900/80 px-3 py-2 text-sm text-slate-100 placeholder:text-slate-500 focus:border-primary-400 focus:outline-none focus:ring-1 focus:ring-primary-400"
            placeholder="Enter admin password"
          />
          <p class="mt-1 text-[0.7rem] text-slate-500">
            Hint: configured in the application as student ID.
          </p>
        </div>

        <button
          type="submit"
          class="flex w-full items-center justify-center rounded-full bg-primary-500 px-4 py-2 text-sm font-medium text-slate-950 shadow-lg shadow-primary-500/40 hover:bg-primary-400"
        >
          Sign in
        </button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
